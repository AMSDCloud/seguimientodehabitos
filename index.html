<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1EC; --card: #FFFFFF; --ink: #1E2B2A; --muted: #5F6E6B; --line: #D5DCD6;
    --si: #2E7D5B; --si-bg: #E1F1E8; --no: #B4443A; --no-bg: #F8E4E1; --focus: #1E5FA8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 'Instrument Sans', system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font: 600 2rem/1.1 'Fraunces', Georgia, serif; margin: 0 0 4px; }
  .fecha { color: var(--muted); margin: 0 0 24px; text-transform: capitalize; }
  .habito { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; transition: border-color .15s, background .15s; }
  .habito.ok { border-color: var(--si); }
  .habito.fail { border-color: var(--no); }
  .habito.falta { border-color: var(--no); background: var(--no-bg); }
  .nombre { font-weight: 600; font-size: 1.05rem; margin-bottom: 10px; }
  .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opciones button { font: inherit; font-weight: 600; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .opciones button[data-v="si"][aria-pressed="true"] { background: var(--si); border-color: var(--si); color: #fff; }
  .opciones button[data-v="no"][aria-pressed="true"] { background: var(--no); border-color: var(--no); color: #fff; }
  textarea { display: none; width: 100%; margin-top: 10px; padding: 10px; font: inherit; border: 2px solid var(--line); border-radius: 10px; resize: vertical; min-height: 72px; }
  .habito.fail textarea { display: block; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #guardar { width: 100%; margin-top: 8px; padding: 15px; font: inherit; font-weight: 600; font-size: 1.05rem; color: #fff; background: var(--ink); border: 0; border-radius: 12px; cursor: pointer; }
  #guardar:disabled { opacity: .5; cursor: not-allowed; }
  #estado { margin-top: 14px; padding: 12px 14px; border-radius: 10px; display: none; font-weight: 600; }
  #estado.cargando { display: block; background: #E6EBF3; color: #2B4468; }
  #estado.ok { display: block; background: var(--si-bg); color: var(--si); }
  #estado.error { display: block; background: var(--no-bg); color: var(--no); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Mis hábitos</h1>
  <p class="fecha" id="fecha"></p>
  <div id="lista"></div>
  <button id="guardar" disabled>Guardar registros</button>
  <div id="estado" role="status" aria-live="polite"></div>
</main>

<script>
  // ====== CONFIG ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbz2tfb9kDMZMHF9pkBoDYeP8M7yqKIl4zdERbc9frWydsvVTr-BZL9j1fN5_q8u7WZ2/exec';   // termina en /exec
  const TOKEN   = 'AKfycbz2tfb9kDMZMHF9pkBoDYeP8M7yqKIl4zdERbc9frWydsvVTr-BZL9j1fN5_q8u7WZ2';                // igual a la de Code.gs

  const $lista = document.getElementById('lista');
  const $guardar = document.getElementById('guardar');
  const $estado = document.getElementById('estado');
  let habitos = [];            // [{nombre, valor: 'si'|'no'|null, motivo}]

  document.getElementById('fecha').textContent =
    new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });

  function estado(tipo, texto) {
    $estado.className = tipo || '';
    $estado.textContent = texto || '';
  }

  function render() {
    $lista.innerHTML = '';
    habitos.forEach((h, i) => {
      const box = document.createElement('div');
      box.className = 'habito' + (h.valor === 'si' ? ' ok' : h.valor === 'no' ? ' fail' : '');
      box.id = 'h' + i;

      const nombre = document.createElement('div');
      nombre.className = 'nombre';
      nombre.textContent = h.nombre;

      const ops = document.createElement('div');
      ops.className = 'opciones';
      [['si', 'Sí'], ['no', 'No']].forEach(([v, label]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.dataset.v = v;
        b.textContent = label;
        b.setAttribute('aria-pressed', h.valor === v);
        b.addEventListener('click', () => { h.valor = v; render(); });
        ops.appendChild(b);
      });

      const ta = document.createElement('textarea');
      ta.placeholder = '¿Por qué no lo hiciste?';
      ta.value = h.motivo;
      ta.addEventListener('input', () => { h.motivo = ta.value; });

      box.append(nombre, ops, ta);
      $lista.appendChild(box);
    });
  }

  async function cargar() {
    estado('cargando', 'Cargando hábitos…');
    try {
      const r = await fetch(`${API_URL}?token=${encodeURIComponent(TOKEN)}`);
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      if (!d.habitos.length) throw new Error('No hay hábitos activos en la hoja "Hábitos".');
      habitos = d.habitos.map(n => ({ nombre: n, valor: null, motivo: '' }));
      render();
      $guardar.disabled = false;
      estado();
    } catch (e) {
      estado('error', 'No se pudieron cargar los hábitos: ' + e.message);
    }
  }

  $guardar.addEventListener('click', async () => {
    // Validación: todos marcados
    let primerFalta = null;
    habitos.forEach((h, i) => {
      const box = document.getElementById('h' + i);
      const falta = h.valor === null;
      box.classList.toggle('falta', falta);
      if (falta && !primerFalta) primerFalta = box;
    });
    if (primerFalta) {
      estado('error', 'Marcá Sí o No en todos los hábitos antes de guardar.');
      primerFalta.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    $guardar.disabled = true;
    estado('cargando', 'Guardando…');
    try {
      const r = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
        body: JSON.stringify({
          token: TOKEN,
          registros: habitos.map(h => ({
            habito: h.nombre,
            cumplido: h.valor === 'si',
            motivo: h.valor === 'no' ? h.motivo.trim() : ''
          }))
        })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      estado('ok', `Guardado: ${d.guardados} registros (${d.fecha} ${d.hora}).`);
      habitos.forEach(h => { h.valor = null; h.motivo = ''; });
      render();
    } catch (e) {
      estado('error', 'No se pudo guardar: ' + e.message + '. Tus respuestas siguen acá, probá de nuevo.');
    } finally {
      $guardar.disabled = false;
    }
  });

  cargar();
</script>
</body>
</html>
